name: CI

on:
  push:
    branches:
      - main
      - chore/portfolio-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ProductsCodingTest.sln

      - name: Build
        run: dotnet build ProductsCodingTest.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ProductsCodingTest.sln --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Audit NuGet packages
        run: dotnet list ProductsCodingTest.sln package --vulnerable --include-transitive

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/products-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/products-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5193

      - name: Audit dependencies
        run: npm audit --audit-level=high
